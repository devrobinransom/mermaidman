name: Bug report
description: Report a reproducible Mermaidman problem
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For parser problems, the smallest failing Mermaid/Mermaidman document is the most useful reproduction.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected instead.
      placeholder: When I ..., Mermaidman ...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Paste the smallest Mermaid/Mermaidman source or exact steps that reproduce the issue.
      render: text
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Web editor
        - Active browser Rust/WASM parser
        - Shared mermaidman-core
        - Tauri desktop
        - Build / setup
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser + version, OS, Node/Rust version, or Tauri platform when relevant.
      placeholder: Firefox 142 / Fedora 44

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Add console output, stack traces, screenshots, or video when useful. Remove secrets first.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report does not contain API keys, credentials, private customer data, or other secrets.
          required: true
