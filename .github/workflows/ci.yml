name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Test active browser parser
        run: cargo test --manifest-path apps/web/src/rust-engine/Cargo.toml

      - name: Test shared Rust core
        run: cargo test -p mermaidman-core

      - name: Build browser WASM assets
        run: pnpm wasm:build

      - name: Lint web app
        run: pnpm lint

      - name: Build web app
        run: pnpm build
